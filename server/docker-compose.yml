version: "3.9"
services:
  mysql:
    image: mysql:8.0
    container_name: gym_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: gym_db
      MYSQL_USER: gym_user
      MYSQL_PASSWORD: gym_pass
    ports:
      - "3307:3306"
    volumes:
      - gym_mysql_data:/var/lib/mysql
volumes:
  gym_mysql_data: